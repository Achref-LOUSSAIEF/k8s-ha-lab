[control_plane]
cp1 ansible_host=192.168.56.11
cp2 ansible_host=192.168.56.12
cp3 ansible_host=192.168.56.13

[workers]
w1 ansible_host=192.168.56.21
w2 ansible_host=192.168.56.22

[k8s:children]
control_plane
workers

[k8s:vars]
ansible_user=vagrant
# Vagrant generates one SSH key per machine
ansible_ssh_private_key_file={{ playbook_dir }}/../.vagrant/machines/{{ inventory_hostname }}/libvirt/private_key
node_ip={{ ansible_host }}
api_vip=192.168.56.100
# One minor below the latest (1.37), so you can practice the upgrade later
k8s_version=v1.36
kube_vip_image=ghcr.io/kube-vip/kube-vip:v1.2.3
pod_subnet=10.244.0.0/16
service_subnet=10.96.0.0/12
